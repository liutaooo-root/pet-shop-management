services:
  - type: web
    name: pet-shop-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # 部署后请在 Render Dashboard → Environment 中手动填入 Supabase 的连接字符串