services:
  - type: web
    name: pet-shop-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pet-shop-db
          property: connectionString

databases:
  - name: pet-shop-db
    databaseName: pet_shop_db
    plan: free